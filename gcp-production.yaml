steps:
  # Step 1: Build Docker image
  - name: gcr.io/cloud-builders/docker
    id: build
    env:
      - 'DOCKER_BUILDKIT=1'
    args: ['build', '-t', '$_SERVICE_IMAGE', '.', '-f', 'Dockerfile']

  # Step 2: Push Docker image to Google Container Registry (GCR)
  - name: gcr.io/cloud-builders/docker
    id: push
    args: ['push', '$_SERVICE_IMAGE']

  # Step 3: Deploy to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    id: deploy
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - --project=$_SERVICE_PROJECT
      - --region=$_SERVICE_REGION
      - --image=$_SERVICE_IMAGE

images:
  - $_SERVICE_IMAGE

# Timeout for the build process
timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE_IMAGE: ${_SERVICE_REGION}-docker.pkg.dev/${PROJECT_ID}/${_DOCKER_REGISTRY}/${_DOCKER_IMAGENAME}:${SHORT_SHA}
  _SERVICE_PROJECT: kuber
  _SERVICE_REGION: europe-west3
  _SERVICE_NAME: hello
  _DOCKER_REGISTRY: my-repo
  _DOCKER_IMAGENAME: myapp
