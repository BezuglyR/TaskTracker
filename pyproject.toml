[project]
name = "tasktracker"
version = "1.1.3"
description = "Tracks user tasks and their progress"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.15.2",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.5.2",
    "fastapi>=0.115.12",
    "flower>=2.0.1",
    "granian>=2.2.5",
    "jinja2>=3.1.6",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.9.1",
    "pydantic[email]>=2.11.4",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "redis>=5.2.1",
    "sqlalchemy>=2.0.40",
    "uvloop>=0.21.0",
]
