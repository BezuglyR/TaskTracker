services:

  postgres:
    container_name: postgres_container
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - ./data/db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tracker

  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    networks:
      - tracker

  worker:
    container_name: worker_container
    build:
      context: .
      dockerfile: ./Dockerfile
    command: celery -A app.services.celery_app worker --loglevel=info
    volumes:
      - ./data/worker_data:/app/app/services/send_email/mock_mail
    environment:
      - CELERY_BROKER_URL=redis://redis:${REDIS_PORT}/0
      - CELERY_RESULT_BACKEND=redis://redis:${REDIS_PORT}/0
    networks:
      - tracker
    depends_on:
      - redis

  app:
    container_name: app_container
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/

        # Rebuild the image on changes to the `pyproject.toml`
        - action: rebuild
          path: ./pyproject.toml
    networks:
      - tracker
    depends_on:
      - postgres
      - worker

  flower:
    container_name: flower_container
    build:
      context: .
      dockerfile: ./Dockerfile
    command: celery -A app.services.celery_app:celery flower
    ports:
      - 5555:5555
    networks:
      - tracker
    depends_on:
      - worker
      - redis


networks:
  tracker:
    driver: bridge
